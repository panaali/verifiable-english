name = "veReference"
version = "0.1.0"
defaultTargets = ["VE", "ve_conformance", "ve_metered", "Iceberg", "ve_service", "ve_english_run", "ve_response_decode", "ResponseShape", "ve_english_route", "ve_speech_acts_route", "ve_senses_route"]

[[lean_lib]]
name = "VE"

[[lean_exe]]
name = "ve_conformance"
root = "Main"

[[lean_exe]]
name = "ve_metered"
root = "MeteredMain"

[[lean_lib]]
name = "Iceberg"

# The service's response shapes (the client's schema source and test tooling, outside the trusted VE tree)
# and the theorems that every runner's rows fit them (ResponseShape.Encoders); a default target, so a
# plain `lake build` checks them.
[[lean_lib]]
name = "ResponseShape"
globs = ["ResponseShape.*"]

[[lean_exe]]
name = "ve_service"
root = "Serve"

[[lean_exe]]
name = "ve_english_run"
root = "VE.English.Run"

[[lean_exe]]
name = "ve_response_decode"
root = "ResponseDecode"

[[lean_exe]]
name = "ve_english_lean_bench"
root = "EnglishLeanBenchMain"

[[lean_exe]]
name = "ve_english_route"
root = "EnglishMain"

[[lean_exe]]
name = "ve_speech_acts_route"
root = "SpeechActsMain"

[[lean_exe]]
name = "ve_senses_route"
root = "SensesMain"
