[workspace]
members = ["ve-kernel", "ve-profile", "ve-surface", "ve-core", "ve"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ve-core = { path = "ve-core" }
ve-kernel = { path = "ve-kernel" }
ve-profile = { path = "ve-profile" }
ve-surface = { path = "ve-surface" }
