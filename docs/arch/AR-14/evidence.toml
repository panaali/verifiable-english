# AR-14, Python's layer map after lean-first, checked by import-linter (architecture pass 2026-10-30, plan 4.4, D5).
# Checked with: uv run python tools/batch_evidence.py --check docs/arch/AR-14
# The A/B is `python -m tools.evidence ab` over tools/lean_first_diff.py's recordings of all nine corpora: the base
# from a worktree of the merge base, the head from this checkout, the pilots of both sides recorded alone and three
# whole-UDHR documents re-run alone on both sides (pilot-rerun.json); the recordings (about 105 MB each) stay out of
# the tree with their SHA-256 in evidence/ab.json. The before and after counts (before.json, after.json, from
# measure.py and scc.py) are saved beside it and stated in REPORT.md.
batch = "AR-14"

[scope]
file = "scope.json"

[gate]
file = "gate.json"

[mutants]
file = "mutants.json"
min = 3

[ab]
file = "ab.json"
corpora = ["probe", "conformance", "readings", "pilots", "discourse", "rights", "quantity", "norm_defaults", "document"]
