# AR-17, the readings S2 regeneration removed (architecture pass 2026-10-19, plan 4.4).
# Checked with: uv run python tools/batch_evidence.py --check docs/arch/AR-17
# The A/B is `docs/arch/AR-17/pilot_parts.py compare`: tools/lean_first_diff.py's compare over every corpus but
# the whole pilots, with the pilots narrowed to the UDHR and constitution readings part documents (L70).
batch = "AR-17"

[scope]
file = "scope.json"

[gate]
file = "gate.json"

[mutants]
file = "mutants.json"
min = 3

[ab]
file = "ab.json"
corpora = ["probe", "conformance", "readings", "pilots", "discourse", "rights", "quantity", "norm_defaults", "document"]

[report]
file = "REPORT.md"
marker = "AR-17 NUMBERS"
lines = [
  "- Scope: `{scope.base|short}..{scope.head|short} --no-merges`, {scope.commits|len} commits: {scope.commits|map:hash|short|code|join:, }.",
  "- Corpus A/B (`{ab.base_commit|short}` against `{ab.head_commit|short}`): {ab.totals.same} records identical, {ab.totals.wording} wording (the report's `checked_by`, DELTA W1), {ab.unlisted} unlisted; pilots: {ab.records.pilots/default} readings part documents, readings {ab.records.readings/default}, rights {ab.records.rights/default}.",
  "- Seeded mutants (tools/mutants.py): {mutants|killed}/{mutants.mutants|len} killed.",
]
