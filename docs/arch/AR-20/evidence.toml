# AR-20, the first Lean consolidation batch: consolidation step 4a + L6 + Paths (architecture pass 2026-10-26,
# plan 4.5). Checked with: uv run python tools/batch_evidence.py --check docs/arch/AR-20
# The A/B is `python -m tools.evidence ab` over tools/lean_first_diff.py's recordings of all nine corpora (base
# f1943fab6 from its own worktree, head from this checkout), kept out of the tree (over 1 MB) with their SHA-256
# in evidence/ab.json. The statements diff (statements.json), the trust measurement before and after
# (trust.json), the encoder equivalence run (canonical-equiv.txt) and the trust-mutant run (trust-mutants.json)
# are saved beside it and stated in REPORT.md.
batch = "AR-20"

[scope]
file = "scope.json"

[gate]
file = "gate.json"

[mutants]
file = "mutants.json"
min = 3

[ab]
file = "ab.json"
corpora = ["probe", "conformance", "readings", "pilots", "discourse", "rights", "quantity", "norm_defaults", "document"]
