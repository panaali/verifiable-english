# AR-16b, ve/readings_verdicts.py split into the package ve/readings_verdicts/ (architecture pass 2026-10-26, plan 4.4).
# Checked with: uv run python tools/batch_evidence.py --check docs/arch/AR-16b
# The A/B is `python -m tools.evidence ab` over tools/lean_first_diff.py's recordings of all nine corpora, recorded
# one corpus at a time, the base from a worktree of the merge base and the head from a worktree of the split commit.
# The cycle, verbatim and relay-gate evidence (cycles.py, verbatim.py, relay-gate-*.json) is saved beside it and
# stated in REPORT.md.
batch = "AR-16b"

[scope]
file = "scope.json"

[gate]
file = "gate.json"

[mutants]
file = "mutants.json"
min = 3

[ab]
file = "ab.json"
corpora = ["probe", "conformance", "readings", "pilots", "discourse", "rights", "quantity", "norm_defaults", "document"]

[report]
file = "REPORT.md"
marker = "AR-16B NUMBERS"
lines = [
  "- Scope: `{scope.base|short}..{scope.head|short} --no-merges`, {scope.commits|len} commits: {scope.commits|map:hash|short|code|join:, }.",
  "- Corpus A/B (`{ab.base_commit|short}` against `{ab.head_commit|short}`): {ab.totals.same} records identical, {ab.totals.unavailable} unavailable on both sides with identical outputs (R7, listed), {ab.unlisted} unlisted; pilots {ab.records.pilots/default}, document {ab.records.document/default}, discourse {ab.records.discourse/default}, rights {ab.records.rights/default}, readings {ab.records.readings/default}.",
  "- Seeded mutants (tools/mutants.py): {mutants|killed}/{mutants.mutants|len} killed.",
]
