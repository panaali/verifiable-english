# relb-clean-run (release B checklist item 5): usecases/eligibility/DEMO.md followed word for word on a clean machine.
# Two machines, both free: "runner" = the ubuntu-24.04 GitHub-hosted runner itself (it already has git, curl, a C
# toolchain and rustup); "container" = a fresh ubuntu:24.04 image on that runner, as a new user who can run sudo
# (nothing preinstalled). DEMO.md's commands are .github/relb-clean-run/commands.txt (ids 1..4c, byte for byte;
# check.py compares them with the cloned DEMO.md), each run by run-demo.sh in the shell state the previous one left.
# Source tested: the last parent of this branch's tip (an exported VM main). If DEMO.md's clone of tag ve-elig-b1
# fails (tag not published yet), harness step h2 clones that source commit instead and the summary says so.
# Uses no secrets. The job's GITHUB_TOKEN only pushes the result branch claude/relb-clean-run-1124-result-<machine>-<run id>.
name: relb-clean-run
on:
  push:
    branches: ['claude/relb-clean-run-1124']
permissions: {}
jobs:
  demo:
    if: github.repository == 'panaali/verifiable-english'
    strategy:
      fail-fast: false
      matrix:
        machine: [runner, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: write
    steps:
      - name: harness setup (not DEMO.md)
        env:
          GH_TOKEN: ${{ github.token }}
          MACHINE: ${{ matrix.machine }}
        run: |
          set -eu
          O=$RUNNER_TEMP/out; H=$RUNNER_TEMP/h; mkdir -p "$O" "$H"; chmod 777 "$O"
          for f in commands.txt run-demo.sh check.py; do
            curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/.github/relb-clean-run/$f" -o "$H/$f"; done
          chmod 755 "$H" "$H"/*
          src=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["parents"][-1]["sha"])')
          { echo "OUT=$O"; echo "H=$H"; echo "SRC_SHA=$src"; echo "SRC_BRANCH=$GITHUB_REF_NAME"; } >> "$GITHUB_ENV"
          { echo "machine=$MACHINE run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
            echo "workflow_commit=$GITHUB_SHA source_commit=$src runner=$RUNNER_NAME image=${ImageOS:-?}-${ImageVersion:-?}"
            echo "disk before cleanup: $(df -h / | tail -1)"; } > "$O/run.txt"
          # Space for the container's image layers and build (DEMO.md asks ~10 GB free); none of these is used by the demo.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          echo "disk after cleanup: $(df -h / | tail -1)" >> "$O/run.txt"
          if [ "$MACHINE" = container ]; then
            docker run -d --name clean -v "$H:/h:ro" -v "$O:/out" ubuntu:24.04 sleep infinity
            # The machine DEMO.md section 0 asks for: a user who can run sudo (the bare image has no sudo, no user).
            docker exec clean sh -c 'apt-get update -q >/dev/null && DEBIAN_FRONTEND=noninteractive apt-get install -y -q sudo >/dev/null && useradd -m -s /bin/bash demo && echo "demo ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/demo && rm -rf /var/lib/apt/lists/*'
            echo "DO=docker exec -u demo -e HOME=/home/demo -e SRC_SHA=$src -e SRC_BRANCH=$GITHUB_REF_NAME -w /home/demo clean bash /h/run-demo.sh /out" >> "$GITHUB_ENV"
          else
            echo "DO=bash $H/run-demo.sh $O" >> "$GITHUB_ENV"
          fi
          cat "$O/run.txt"
      - name: harness - machine before the demo
        run: $DO henv
      - name: DEMO.md 1 - get git
        run: $DO 1
      - name: DEMO.md 2 - clone the release (tag ve-elig-b1)
        run: |
          $DO 2 && exit 0
          echo "::warning::DEMO.md step 2 failed (is tag ve-elig-b1 on GitHub?); harness step h2 clones the source commit $SRC_SHA instead"
          $DO h2
      - name: DEMO.md 3 - install
        run: $DO 3
      - name: DEMO.md 4 - export PATH
        run: $DO 4a
      - name: DEMO.md 4 - ask about B15 (file)
        run: $DO 4b
      - name: DEMO.md 4 - ask about B15 (flags)
        run: $DO 4c
      - name: harness - tested commit, copy DEMO.md
        if: always()
        run: $DO hrev
      - name: extra - install.sh again ("safe and quick")
        if: always()
        continue-on-error: true
        run: $DO x3
      - name: harness - compare with DEMO.md
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$OUT"
          python3 "$H/check.py" "$OUT" | tee "$OUT/check.txt"
          { echo; echo "disk at end: $(df -h / | tail -1)"; } >> "$OUT/run.txt"
      - name: harness - upload the log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: relb-clean-run-${{ matrix.machine }}
          path: ${{ runner.temp }}/out
          retention-days: 30
      - name: harness - push the result branch
        if: always()
        env:
          TOK: ${{ github.token }}
          MACHINE: ${{ matrix.machine }}
        run: |
          set -eu
          sudo chown -R "$(id -u):$(id -g)" "$OUT"
          R=$RUNNER_TEMP/result; rm -rf "$R"; mkdir -p "$R"; cp -a "$OUT"/. "$R"/
          find "$R" -type f -size +5M -exec gzip -9 {} \;
          cd "$R"; git init -q; git add -A
          git -c user.name="VE actions runner" -c user.email=noreply@anthropic.com commit -q -m "relb-clean-run $MACHINE run $GITHUB_RUN_ID: result"
          B="claude/relb-clean-run-1124-result-$MACHINE-$GITHUB_RUN_ID"
          AUTH=$(printf 'x-access-token:%s' "$TOK" | base64 -w0); echo "::add-mask::$AUTH"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push -q "https://github.com/$GITHUB_REPOSITORY" "HEAD:refs/heads/$B" \
            || { sleep 20; git -c http.extraheader="AUTHORIZATION: basic $AUTH" push -q "https://github.com/$GITHUB_REPOSITORY" "HEAD:refs/heads/$B"; }
          echo "pushed $B"
