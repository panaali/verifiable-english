# VE aarch64 gate job on GitHub Actions (2026-10-28 dri-cloudcpu, reviews/cloud-cpu-20261028.md): ve-job.yml with the run job on
# ubuntu-24.04-arm (Linux arm64, 4 vCPU / 16 GB, free for public repositories), the aarch64 toolchain (Lean v4.24.0
# linux_aarch64, uv 0.12.19 aarch64, rustup if the image lacks it; sha256 pinned, digests checked against GitHub's release
# API 2026-10-28) and a 330-min job timeout (GitHub's job limit is 6 h). Staged only: gha-arm-gate.sh puts it at
# .github/workflows/ve-job.yml of its own job commits (shadow pilot of the train's aarch64 gate leg); VE main is unchanged.
# VE compute job on GitHub Actions: a zero-token compute pool (manage-agents dri-gha, 2026-10-28).
# A job is one push of branch ci-job/<job> by the VM dispatcher (gha-dispatch.sh, via github-push.sh only). Its tip is ONE
# commit on top of the job's exported head that adds only ci-job/job.json, ci-job/job.sh and this file.
#   run:     read-only token, no credentials kept; checks that shape, checks out the exported head itself, installs the
#            pinned toolchain (Lean v4.24.0, uv 0.12.19, zstd; git 2.56.1 from 2026-11-13: step "git"), then
#            bash job.sh run <checkout> <out dir> <job.json "argv"...>   (same contract as the cloud runner's cloud-tm-job.sh)
#   publish: write token; commits ONLY cloud-results/<job>/ on top of the exported head and pushes ci-result/<job>
#            (never --force, never another branch). The VM's cloud-pull.sh verifies it like any cloud result.
# Never triggered by pull requests, forks, schedules or other branches. Uses no secrets. Actions are pinned by commit.
name: ve-job
on:
  push:
    branches: ['ci-job/**']
permissions: {}
concurrency:
  group: ve-job-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  run:
    if: github.repository == 'panaali/verifiable-english'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330
    permissions:
      contents: read
    outputs:
      job: ${{ steps.job.outputs.job }}
      head: ${{ steps.job.outputs.head }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: job
        name: job commit
        run: |
          set -euo pipefail
          job=${GITHUB_REF_NAME#ci-job/}
          [[ $job =~ ^[A-Za-z0-9._-]+$ ]] || { echo "bad job name $job"; exit 1; }
          head=$(python3 -I -c 'import json; print(json.load(open("ci-job/job.json"))["head"])')
          [ "$(python3 -I -c 'import json; print(json.load(open("ci-job/job.json"))["job"])')" = "$job" ] || { echo "job.json is not $job"; exit 1; }
          [ "$(git rev-parse HEAD~1)" = "$head" ] && [ -z "$(git rev-parse -q --verify HEAD^2 || true)" ] || { echo "the job commit's parent is not $head"; exit 1; }
          extra=$(git diff --name-only HEAD~1 HEAD | grep -v -x -E 'ci-job/job\.json|ci-job/job\.sh|\.github/workflows/ve-job\.yml' || true)
          [ -z "$extra" ] || { echo "the job commit changes other files: $extra"; exit 1; }
          mkdir -p "$RUNNER_TEMP/ci-job" "$RUNNER_TEMP/out"
          cp ci-job/job.json ci-job/job.sh "$RUNNER_TEMP/ci-job/"
          git checkout -q --detach "$head"
          echo "job=$job" >> "$GITHUB_OUTPUT"; echo "head=$head" >> "$GITHUB_OUTPUT"
      - name: tools
        run: |
          set -euo pipefail
          t0=$(date +%s)
          cd "$RUNNER_TEMP"
          curl -sSfL --retry 3 -o lean.tar.zst https://github.com/leanprover/lean4/releases/download/v4.24.0/lean-4.24.0-linux_aarch64.tar.zst
          echo "237f8ef43fb40d16681871fb04b2c56f023afc02a5a3877831d35dd493823c23  lean.tar.zst" | sha256sum -c -
          curl -sSfL --retry 3 -o uv.tgz https://github.com/astral-sh/uv/releases/download/0.12.19/uv-aarch64-unknown-linux-gnu.tar.gz
          echo "0804e9b164c64b6914182d5920c08551958a095986f10a3731056df701126436  uv.tgz" | sha256sum -c -
          command -v zstd > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zstd; }
          sudo mkdir -p /opt/lean && sudo chown "$(id -u)" /opt/lean
          zstd -dc lean.tar.zst | tar -x -C /opt/lean --strip-components=1
          sudo tar -xzf uv.tgz -C /usr/local/bin --strip-components=1
          rm -f lean.tar.zst uv.tgz
          sudo ln -sf /opt/lean/bin/lean /usr/local/bin/lean; sudo ln -sf /opt/lean/bin/lake /usr/local/bin/lake
          if ! command -v rustup > /dev/null; then
            curl -sSfL --retry 3 -o rustup-init https://static.rust-lang.org/rustup/archive/1.28.2/aarch64-unknown-linux-gnu/rustup-init
            echo "e3853c5a252fca15252d07cb23a1bdd9377a8c6f3efa01531109281ae47f841c  rustup-init" | sha256sum -c -
            chmod +x rustup-init && ./rustup-init -y -q --profile minimal --default-toolchain none && rm -f rustup-init
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"; fi
          printf 'step\trc\tseconds\ntools\t0\t%s\n' "$(( $(date +%s) - t0 ))" > "$RUNNER_TEMP/out/gha-setup.tsv"
          { echo "run_id=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT runner=$RUNNER_NAME image=${ImageOS:-?}-${ImageVersion:-?} arch=$(uname -m) nproc=$(nproc)"; lean --version; uv --version; (command -v rustup || echo "$HOME/.cargo/bin/rustup"); df -h / | tail -1; } > "$RUNNER_TEMP/out/gha.txt"
      # 2026-11-13 arm-shard-toolchain-mix (backlog row arm-shard-toolchain-mix): ONE git on every shard of a leg. The
      # ubuntu-24.04-arm pool serves two images at once (ubuntu24-arm64-20261101.172.1 with git 2.56.0, 20261111.182.1 with
      # 2.56.1); gate.py records `git --version` among its toolchains and tools/gate_shards.py refuses a leg whose shards
      # differ ("shard <k>: toolchains differ", 0 tests run). Like Lean and uv, git is pinned: the runner's own git when it
      # IS the pin, else the pin built from kernel.org's source tarball (sha256 pinned, from kernel.org's sha256sums.asc;
      # ~80 s at -j4 on the VM) into /opt/git and linked as /usr/local/bin/git (first on gate-job.sh's PATH, so gate.py
      # records and the history tests run that git). A pin that cannot be fetched or built keeps the runner's git and says
      # so (gha.txt "git: PIN FAILED ...", a workflow warning): the leg is then exactly as before (a mixed leg is still
      # refused); the comparison is never loosened. Bump GIT_PIN and GIT_SHA together when the pool's images move past the
      # pin (else every shard builds it: consistent, ~2 min more per shard).
      - name: git
        run: |
          set -euo pipefail
          t0=$(date +%s)
          GIT_PIN=2.56.1
          GIT_SHA=f0b0bf89264b9bd2e1c640363e7529643989da76281600473c50745cd34a607f
          have=$(git --version 2>/dev/null || echo "no git")
          cd "$RUNNER_TEMP"
          pin_git() {
            curl -sSfL --retry 3 -o git.tar.xz "https://mirrors.edge.kernel.org/pub/software/scm/git/git-$GIT_PIN.tar.xz" \
              && echo "$GIT_SHA  git.tar.xz" | sha256sum -c - \
              && { [ -f /usr/include/zlib.h ] || { sudo apt-get update -qq && sudo apt-get install -y -qq zlib1g-dev; }; } \
              && rm -rf git-src && mkdir git-src && tar -xJf git.tar.xz -C git-src --strip-components=1 \
              && sudo mkdir -p /opt/git && sudo chown "$(id -u)" /opt/git \
              && make -C git-src -j"$(nproc)" prefix=/opt/git NO_TCLTK=1 NO_GETTEXT=1 NO_PERL=1 NO_PYTHON=1 NO_CURL=1 NO_EXPAT=1 NO_OPENSSL=1 install > git-build.log 2>&1 \
              && [ "$(/opt/git/bin/git --version)" = "git version $GIT_PIN" ] \
              && sudo ln -sf /opt/git/bin/git /usr/local/bin/git \
              && [ "$(/usr/local/bin/git --version)" = "git version $GIT_PIN" ]
          }
          if [ "$have" = "git version $GIT_PIN" ]; then how="the runner's git is the pin $GIT_PIN"
          elif pin_git; then how="pin $GIT_PIN built from source (the runner has $have)"
          else
            how="PIN FAILED: kept the runner's $have (pin $GIT_PIN; $( { tail -n 3 git-build.log 2>/dev/null || true; } | tr '\n' ' '))"
            echo "::warning::git $how"
          fi
          rm -rf git.tar.xz git-src
          printf 'git\t0\t%s\n' "$(( $(date +%s) - t0 ))" >> "$RUNNER_TEMP/out/gha-setup.tsv"
          echo "git: $how; gate-job.sh's PATH finds $(PATH=/usr/local/bin:$PATH git --version) at $(PATH=/usr/local/bin:$PATH command -v git)" >> "$RUNNER_TEMP/out/gha.txt"
      - name: job
        run: |
          set -uo pipefail
          mapfile -t argv < <(python3 -I -c 'import json, sys; print("\n".join(json.load(open(sys.argv[1]))["argv"]))' "$RUNNER_TEMP/ci-job/job.json")
          bash "$RUNNER_TEMP/ci-job/job.sh" run "$GITHUB_WORKSPACE" "$RUNNER_TEMP/out" "${argv[@]}"
      - if: always() && steps.job.outputs.job != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: out
          path: ${{ runner.temp }}/out
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: run
    if: always() && needs.run.outputs.job != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          ref: ${{ needs.run.outputs.head }}
          fetch-depth: 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: out
          path: ${{ runner.temp }}/out
      - name: push ci-result
        env:
          JOB: ${{ needs.run.outputs.job }}
        run: |
          set -euo pipefail
          D=cloud-results/$JOB; O=$RUNNER_TEMP/out
          rm -rf "$D"; mkdir -p "$D"
          for f in "$O"/*; do [ -f "$f" ] || continue
            case $f in *.log) tail -n 200 "$f" > "$D/$(basename "$f").tail";; *) cp "$f" "$D/";; esac; done
          echo "run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID run_result=${{ needs.run.result }}" >> "$D/gha.txt"
          git add -- "$D"
          git -c user.name="VE actions runner" -c user.email=noreply@anthropic.com commit -q -m "ci-job $JOB: result" -- "$D"
          git push -q origin "HEAD:refs/heads/ci-result/$JOB" || { sleep 20; git push -q origin "HEAD:refs/heads/ci-result/$JOB"; }
          git rev-parse HEAD
