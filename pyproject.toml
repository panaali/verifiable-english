[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "verifiable-english"
version = "0.1.0"
description = "Verifiable English: VE v0 language core (ve) and experiment harness (ve_experiments)"
requires-python = ">=3.12"
dependencies = [
    "lark>=1.3",
    "google-genai>=2.24.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6,<4",
    "tokenizers>=0.22,<0.23",
]

[project.scripts]
ve = "ve.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "hypothesis>=6.140",
    "scikit-learn>=1.7",
    "scipy>=1.16",
]

[tool.hatch.build.targets.wheel]
packages = ["ve", "ve_experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls real model CLIs (run with `pytest -m live`)"]
addopts = "-ra -m 'not live'"
