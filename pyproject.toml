[project]
name = "verifiable-english"
version = "0.0.1"
description = "Verifiable English: language core (ve) and experiment harness (ve_experiments)"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ve*", "ve_experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls real model CLIs (run with `pytest -m live`)"]
addopts = "-m 'not live'"
