[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "verifiable-english"
version = "0.1.0"
description = "Experimental VE v0 relational first-order language core"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4",
    "hypothesis>=6.140",
    "lark>=1.3",
    "scikit-learn>=1.7",
    "scipy>=1.16",
]

[tool.hatch.build.targets.wheel]
packages = ["ve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
